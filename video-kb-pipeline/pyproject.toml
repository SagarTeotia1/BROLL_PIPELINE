[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "video-kb-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "boto3>=1.35",
    "modal>=0.64",
    "faster-whisper>=1.0",
    "opencv-python-headless>=4.10",
    "ffmpeg-python>=0.2",
    "torch>=2.4",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "tenacity>=8.0",
    "tqdm>=4.66",
    "nanoid>=2.0",
    "neo4j>=5.0",
    "pyannote.audio>=3.1",
    "openai>=1.50",  # L4-L6 reasoning/planning/agent calls via OpenRouter — see shared/llm_client.py.
    "groq>=0.11",  # optional fallback provider, not used by default — see shared/llm_client.py.
    "requests>=2.31",  # A2 Pexels stock-asset client — see knowledge_base/stock_assets/client.py.
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
