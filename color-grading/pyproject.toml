[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "color-analyzer"
version = "1.1.0"
description = "Production-grade colour-grading analysis & decision engine (GPU/CPU)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shubham Solanki" }]
keywords = ["color grading", "color science", "computer vision", "video editing", "cuda"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "rich>=13.0",
    "tqdm>=4.66",
    "numba>=0.59",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "pillow>=10.0"]
gpu = ["cupy-cuda12x>=13.0"]  # match your CUDA toolkit
dev = ["pytest>=8.0"]

[project.scripts]
color-analyzer = "color_analyzer.main:run"

[project.urls]
Homepage = "https://github.com/iamshubham1704/color-analyzer"

[tool.setuptools.packages.find]
include = ["color_analyzer*"]
exclude = ["color_analyzer.tests*"]
